services:
  - type: web
    name: firebird-api
    env: python
    plan: free
    buildCommand: |
      echo "🔧 Instalando dependências..."
      pip install --upgrade pip
      pip install --no-cache-dir -r requirements.txt || echo "⚠️ Algumas dependências falharam, continuando..."
    startCommand: python start.py
    envVars:
      - key: DATABASE_PATH
        value: D:\sistemas\fcerta\DB\ALTERDB.ib
      - key: DATABASE_HOST
        value: 25.90.252.41
      - key: DATABASE_USERNAME
        value: SYSDBA
      - key: DATABASE_PASSWORD
        value: masterkey
      - key: DATABASE_PORT
        value: 3050
      - key: DATABASE_CHARSET
        value: WIN1252