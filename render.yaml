services:
  - type: web
    name: firebird-api
    env: python
    plan: free
    buildCommand: |
      pip install --upgrade pip
      pip install --no-cache-dir -r requirements.txt
    startCommand: gunicorn main_with_fallback:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: DATABASE_PATH
        value: D:\sistemas\fcerta\DB\ALTERDB.ib
      - key: DATABASE_HOST
        value: 25.90.252.41
      - key: DATABASE_USERNAME
        value: SYSDBA
      - key: DATABASE_PASSWORD
        value: masterkey
      - key: DATABASE_PORT
        value: 3050
      - key: DATABASE_CHARSET
        value: WIN1252
      - key: PYTHON_VERSION
        value: 3.11.5